name: "⏱ Chrono"
description: "Ticket de régie — TMA ou Agile, génère une ligne de suivi des temps"
labels: ["chrono"]
body:
  - type: markdown
    attributes:
      value: |
        ## Nouvelle carte Chrono
        Une carte Chrono est facturée en **régie** (temps passé) dans le cadre d'un contrat SIH/TMA.
        Elle génèrera une ligne dans le suivi des temps Grinn Go.

  - type: dropdown
    id: chrono_type
    attributes:
      label: "Type"
      options:
        - "🔧 TMA — Corrective (bug)"
        - "✨ TMA — Évolutive (amélioration)"
        - "🛡 TMA — Préventive"
        - "📖 Agile — Story"
        - "⚙️ Agile — Task"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Priorité"
      options:
        - "🟢 Basse"
        - "🟡 Moyenne"
        - "🟠 Haute"
        - "🔴 Critique"
    validations:
      required: true

  - type: dropdown
    id: urgency
    attributes:
      label: "Niveau d'urgence"
      description: "Obligatoire pour les Chrono TMA. Par défaut : Normal."
      options:
        - "🟢 Normal"
        - "🟠 Urgent (<48h)"
        - "🔴 Critique (<24h)"
      default: 0
    validations:
      required: true

  - type: input
    id: estimated_hours
    attributes:
      label: "Estimation (heures)"
      placeholder: "Ex: 2"
      description: "Estimation en heures. Sera pré-remplie dans le suivi des temps Grinn Go."

  - type: textarea
    id: description
    attributes:
      label: "Description"
      placeholder: "Décrivez le problème ou la demande..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Étapes pour reproduire (si bug)"
      placeholder: |
        1. Aller sur...
        2. Cliquer sur...
        3. Observer que...

  - type: textarea
    id: expected
    attributes:
      label: "Comportement attendu"
      placeholder: "Que devrait-il se passer ?"

  - type: textarea
    id: screenshots
    attributes:
      label: "Captures d'écran"
      placeholder: "Glissez-déposez vos captures ici"

  - type: input
    id: url
    attributes:
      label: "URL concernée"
      placeholder: "https://..."
