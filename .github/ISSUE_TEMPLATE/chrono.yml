name: "⏱ Chrono"
description: "Ticket de régie — TMA ou régie, génère une ligne de suivi des temps"
labels: ["chrono"]
body:
  - type: markdown
    attributes:
      value: |
        ## Nouvelle carte Chrono
        Une carte Chrono est facturée en **régie** (temps passé) dans le cadre d'un contrat SIH/TMA.
        Elle génèrera une ligne dans le suivi des temps Grinn Go.

  - type: dropdown
    id: chrono_type
    attributes:
      label: "Type"
      options:
        - "🔧 TMA — Corrective (bug)"
        - "🛡 TMA — Préventive"
        - "📖 Régie"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Priorité"
      options:
        - "🟢 Basse"
        - "🟡 Moyenne"
        - "🟠 Haute"
        - "🔴 Critique"
    validations:
      required: true

  - type: dropdown
    id: urgency
    attributes:
      label: "Niveau d'urgence"
      description: "Obligatoire pour les Chrono TMA. Par défaut : Normal."
      options:
        - "🟢 Normal"
        - "🟠 Urgent (<48h)"
        - "🔴 Critique (<24h)"
      default: 0
    validations:
      required: true

  - type: input
    id: estimated_hours
    attributes:
      label: "Estimation (heures)"
      placeholder: "Ex: 2"
      description: "Estimation en heures. Sera pré-remplie dans le suivi des temps Grinn Go."

  - type: textarea
    id: description
    attributes:
      label: "Description"
    validations:
      required: true
