name: "⏱ Chrono"
description: "Ticket de régie — TMA ou régie, génère une ligne de suivi des temps"
labels: ["chrono"]
body:
  - type: markdown
    attributes:
      value: |
        ## Nouvelle carte Chrono
        Une carte Chrono est facturée en **régie** (temps passé) dans le cadre d'un contrat SIH/TMA.
        Elle génèrera une ligne dans le suivi des temps Grinn Go.

  - type: dropdown
    id: chrono_type
    attributes:
      label: "Type"
      options:
        - "🔧 TMA — Corrective (bug)"
        - "🛡 TMA — Préventive"
        - "📖 Régie"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Priorité"
      options:
        - "🟢 Basse"
        - "🟡 Moyenne"
        - "🟠 Haute"
        - "🔴 Très haute"
    validations:
      required: true

  - type: dropdown
    id: niveau
    attributes:
      label: "Niveau de prise en charge"
      description: "Standard : dans les meilleurs délais. Prioritaire : prise en charge sous 8 h ouvrées. Critique : sous 4 h ouvrées. Prioritaire et Critique majorent le temps décompté."
      options:
        - "🟢 Standard"
        - "🟠 Prioritaire (sous 8 h ouvrées)"
        - "🔴 Critique (sous 4 h ouvrées)"
      default: 0
    validations:
      required: true

  - type: input
    id: estimated_hours
    attributes:
      label: "Estimation (heures)"
      placeholder: "Ex: 2"
      description: "Estimation en heures. Sera pré-remplie dans le suivi des temps Grinn Go."

  - type: textarea
    id: description
    attributes:
      label: "Description"
    validations:
      required: true
