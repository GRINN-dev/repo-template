name: "🚀 Epic"
description: "Epic liée à un devis — regroupe un ensemble de cartes Standard (forfait)"
labels: ["epic"]
body:
  - type: markdown
    attributes:
      value: |
        ## Nouvelle Epic
        Une Epic représente un **forfait signé** (devis). Elle regroupe uniquement des cartes Standard.
        Le numéro de devis est obligatoire.

  - type: input
    id: quote_number
    attributes:
      label: "Numéro de Devis"
      placeholder: "Ex: DEV-2026-042"
      description: "Numéro du devis Grinn associé à cette Epic."
    validations:
      required: true

  - type: input
    id: quote_amount
    attributes:
      label: "Montant du Devis (HT)"
      placeholder: "Ex: 12 500 €"

  - type: textarea
    id: description
    attributes:
      label: "Description de l'Epic"
      placeholder: "Décrivez l'objectif global de ce forfait..."
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: "Périmètre / Fonctionnalités incluses"
      placeholder: |
        - [ ] Fonctionnalité 1
        - [ ] Fonctionnalité 2
        - [ ] Fonctionnalité 3
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: "Références / Documents complémentaires"
      placeholder: "Maquettes, specs, liens utiles, PDF devis..."

  - type: dropdown
    id: priority
    attributes:
      label: "Priorité"
      options:
        - "🟢 Basse"
        - "🟡 Moyenne"
        - "🟠 Haute"
        - "🔴 Critique"
    validations:
      required: true
